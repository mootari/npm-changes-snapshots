name: Daily snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      draft:
        description: Draft
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
