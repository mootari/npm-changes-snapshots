name: Daily snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install DuckDB CLI
        run: |
          gh release download v1.5.6 --repo duckdb/duckdb --pattern duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - id: snapshot
        run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          gh release create "${{ steps.snapshot.outputs.tag }}"
          "out/changes-${{ steps.snapshot.outputs.date }}.parquet"
          out/manifest.json
          $(test -f out/delta.json && echo out/delta.json)
          --title "npm changes snapshot ${{ steps.snapshot.outputs.date }}"
          --notes-file out/notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
